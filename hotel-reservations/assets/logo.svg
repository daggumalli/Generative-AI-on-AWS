<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c0c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="100" fill="url(#skyGradient)"/>
  
  <!-- City buildings silhouette -->
  <rect x="10" y="60" width="15" height="40" fill="url(#buildingGradient)"/>
  <rect x="30" y="45" width="20" height="55" fill="url(#buildingGradient)"/>
  <rect x="55" y="50" width="18" height="50" fill="url(#buildingGradient)"/>
  <rect x="78" y="35" width="25" height="65" fill="url(#buildingGradient)"/>
  <rect x="108" y="40" width="22" height="60" fill="url(#buildingGradient)"/>
  <rect x="135" y="55" width="16" height="45" fill="url(#buildingGradient)"/>
  <rect x="156" y="30" width="20" height="70" fill="url(#buildingGradient)"/>
  <rect x="180" y="65" width="15" height="35" fill="url(#buildingGradient)"/>
  
  <!-- Building windows (lights) -->
  <rect x="32" y="50" width="3" height="3" fill="#ffd700" opacity="0.8"/>
  <rect x="37" y="55" width="3" height="3" fill="#ffd700" opacity="0.6"/>
  <rect x="32" y="65" width="3" height="3" fill="#ffd700" opacity="0.9"/>
  
  <rect x="60" y="55" width="3" height="3" fill="#4fc3f7" opacity="0.8"/>
  <rect x="65" y="60" width="3" height="3" fill="#4fc3f7" opacity="0.7"/>
  
  <rect x="85" y="45" width="4" height="4" fill="#ffd700" opacity="0.9"/>
  <rect x="92" y="50" width="4" height="4" fill="#ffd700" opacity="0.6"/>
  <rect x="85" y="60" width="4" height="4" fill="#ffd700" opacity="0.8"/>
  <rect x="92" y="70" width="4" height="4" fill="#ffd700" opacity="0.7"/>
  
  <rect x="115" y="50" width="3" height="3" fill="#4fc3f7" opacity="0.8"/>
  <rect x="120" y="55" width="3" height="3" fill="#4fc3f7" opacity="0.9"/>
  <rect x="115" y="65" width="3" height="3" fill="#4fc3f7" opacity="0.6"/>
  
  <rect x="162" y="40" width="3" height="3" fill="#ffd700" opacity="0.9"/>
  <rect x="167" y="45" width="3" height="3" fill="#ffd700" opacity="0.7"/>
  <rect x="162" y="55" width="3" height="3" fill="#ffd700" opacity="0.8"/>
  <rect x="167" y="65" width="3" height="3" fill="#ffd700" opacity="0.6"/>
  
  <!-- Hotel icon in the center -->
  <circle cx="100" cy="25" r="15" fill="rgba(79, 195, 247, 0.2)" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="32" text-anchor="middle" fill="#4fc3f7" font-size="16" font-family="Arial, sans-serif" filter="url(#glow)">🏨</text>
  
  <!-- Stars -->
  <circle cx="25" cy="15" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="45" cy="8" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="75" cy="12" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="125" cy="10" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="155" cy="18" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="175" cy="12" r="1" fill="#ffffff" opacity="0.6"/>
</svg>